seed: 42

cv:
  n_splits: 5

paths:
  data_dir: data
  runs_dir: runs
  train_json: data/train.json
  test_json: data/test.json
  train_csv: data/ytrain.csv
  test_csv: data/ytest.csv

mlflow:
  tracking_uri: http://127.0.0.1:5000
  experiment_name: bot-detector

experiments:
  - cnn_mlp

models:
  cnn_mlp:
    max_len: 128
    vocab_size: 20000
    embed_dim: 128
    kernel_sizes: [2, 3, 4, 5]
    num_filters: 64
    hidden_cnn: 64
    hidden_hc: 8
    epochs: 20
    batch_size: 64
    lr: 0.001
    patience: 3
    class_weight: balanced